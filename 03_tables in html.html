    <!-- This is anther example which include table header,body and footer -->
    <table border="1" >


        <caption>This table is include table header,body and footer</caption>
        <thead>
            <tr>
                <th>Serial Numnber</th>
                <th>item</th>
                <th>Quantity</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Apple</td>
                <td>1</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Apple,watermelon, banana</td>
                <td>3</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Apple, mango</td>
                <td>2</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <!-- <td ></td> -->
                <td colspan="2">Total items</td>
                <td>Total 6</td>
            </tr>
            
        </tfoot>

        
    </table>
        <hr>


</body>
</html>
